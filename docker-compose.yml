version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: elearn_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: elearn_db
    ports:
      - "3310:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: elearn_phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      - mysql

  server:
    build:
      context: ./server
    container_name: elearn_server
    restart: always
    ports:
      - "5000:5000"
    # This volume setup allows hot-reloading (changes in your local files instantly update in the container)
    volumes:
      - ./server:/app
      - /app/node_modules
    environment:
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=elearn_db
      - PORT=5000
      # Cloudinary credentials should be provided via host env or a .env file
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mysql

volumes:
  mysql_data:
